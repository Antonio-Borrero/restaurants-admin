<div>
  <a routerLink="/restaurants" class="btn btn-secondary back-button">← Ir a restaurantes</a>
  @if (menu(); as menu) {
    <header class="menu-header">
      <h1>{{ menu.name }}</h1>
      <p>Gestión de carta</p>
    </header>
    @if (isMobile()) {
      <app-menu-mobile
        [menu]="menu"
        [categoryCount]="categoryCount()!"
        [dishCount]="dishCount()!"
        (openCategoryModal)="modal.set({ type: 'createCategory' })"
        (openDishModal)="modal.set({ type: 'createDish', categoryId: $event })"
      />
    } @else {
      <app-menu-desktop
        [menu]="menu"
        [categoryCount]="categoryCount()!"
        [dishCount]="dishCount()!"
        (openCategoryModal)="modal.set({ type: 'createCategory' })"
        (openDishModal)="modal.set({ type: 'createDish', categoryId: $event })"
      />
    }
  }
</div>

@if (modal(); as activeModal) {
  @if (activeModal.type === 'createCategory') {
    <app-category-form [isOpen]="true" (close)="modal.set(null)" (created)="getRestaurantMenu()" />
  }
  @if (activeModal.type === 'createDish') {
    <app-dish-form
      [isOpen]="true"
      (close)="modal.set(null)"
      (created)="getRestaurantMenu()"
      [categoryId]="activeModal.categoryId"
    />
  }
}
