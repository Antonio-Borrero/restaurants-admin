<main class="login-page">
  <section class="login">
    <app-logo [width]="logoWidth()" />
    <div class="login-main">
      <div class="login-heading">
        <h1>Entra a tu panel</h1>
        <p>Administra la carta de los restaurantes que tienes a cargo</p>
      </div>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        @if (error()) {
          <p class="error"><app-danger-icon [width]="25" />{{ error() }}</p>
        }
        <label for="email">Correo:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="tu@restaurante.com"
          formControlName="email"
          required
        />

        <label for="password">Contraseña:</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="********"
          formControlName="password"
          required
        />

        <button type="submit" class="btn btn-primary">Iniciar sesión</button>
      </form>
      <p class="register-link">¿No tienes cuenta? <a href="/register">Registrar</a></p>
    </div>
    <footer>
      <p class="copyright">&copy; 2026 DishBoard. Todos los derechos reservados.</p>
    </footer>
  </section>
  <aside class="login-aside">
    <p>Mantén tu carta al día, desde donde estés. Sin complicaciones.</p>
  </aside>
</main>
